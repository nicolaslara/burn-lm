[package]
name = "burn-lm-llama"
authors = [
    "guillaumelagrange <lagrange.guillaume.1@gmail.com>",
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
]
categories = []
description = "Burn Large Models Engine - Inference."
documentation = "https://docs.rs/burn-lm-inference"
repository = "https://github.com/tracel-ai/burn-lm"
rust-version.workspace = true

edition.workspace = true
version.workspace = true
license.workspace = true
readme.workspace = true


[features]
# default = ["pretrained", "inference-server"]
default = ["pretrained", "inference-server", "training"]
inference-server = ["burn-lm-inference"]
pretrained = ["burn/network", "dep:dirs"]
training = ["burn/train"]

llama3 = ["dep:tiktoken-rs", "dep:rustc-hash", "dep:base64"]
tiny = ["dep:tokenizers"]

# Load a model straight out of a Hugging Face repo: the repo's own `config.json` and the canonical
# safetensors weights, rather than a checkpoint someone converted to a burn-only format for us.
# See `nn/llama/hf`.
hf = [
    "pretrained",
    "dep:tokenizers",
    "dep:serde_json",
    "dep:reqwest",
    "burn-store/safetensors",
    "burn-store/memmap",
]

# The paged decode kernel, one feature per backend it has an implementation for.
#
# These carry no `burn/<backend>` of their own on purpose: whoever picks the backend for the binary
# already did that, and duplicating it here would let a build turn on the kernel for a backend the
# model is not running on. What they do is make sure the kernel is *compiled in* for the backend
# that was picked — without them `burn-lm-paged-kv` builds with no backend feature at all, the
# availability gate answers `None` forever, and the only symptom is that
# `BURN_LM_PAGED_ATTENTION=kernel` quietly does nothing.
metal = ["burn-lm-paged-kv/metal"]
wgpu = ["burn-lm-paged-kv/wgpu"]
vulkan = ["burn-lm-paged-kv/vulkan"]
webgpu = ["burn-lm-paged-kv/webgpu"]
cuda = ["burn-lm-paged-kv/cuda"]
rocm = ["burn-lm-paged-kv/rocm"]

# To import pytorch weights
import = ["burn-store/pytorch"]

# Feature flags for testing
test-non-default = []
test-ndarray = ["burn/ndarray"]
test-libtorch = ["burn/tch", "test-non-default"]
test-cuda = [
    "burn/cuda",
    "burn/fusion",
    "burn/autotune",
    # "burn/autotune-checks",
    "cuda",
    "test-non-default",
]
test-wgpu = [
    "burn/wgpu",
    "burn/default",
    # "burn/autotune-checks",
    "wgpu",
    "test-non-default",
]
# Bench/test on the same backend the Metal server uses.
test-metal = [
    "burn/metal",
    "burn/default",
    "metal",
    "test-non-default",
]

[dependencies]
burn-lm-paged-kv = { path = "../burn-lm-paged-kv", version = "0.0.1" }
burn = { workspace = true, features = [
    "std",
    "ndarray",
    "network",
    "dataset",
], default-features = false }
# Always on: the published `.mpk` checkpoints are fed to the model through burn-store's applier
# (see `nn/llama/legacy_mpk.rs`).
burn-store = { workspace = true, default-features = false, features = ["std"] }
rmp-serde = { workspace = true }
itertools = { version = "0.12.1", default-features = false, features = [
    "use_alloc",
] }
dirs = { workspace = true, optional = true }
serde = { version = "1.0.192", default-features = false, features = [
    "derive",
    "alloc",
] } # alloc is for no_std, derive is needed


# Tiktoken tokenizer (llama 3)
tiktoken-rs = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }

# SentencePiece tokenizer (tiny llama / llama 2), and `tokenizer.json` for the Hugging Face path
tokenizers = { workspace = true, features = ["onig"], optional = true }

# Reading a repo's `config.json` (the `hf` feature)
serde_json = { workspace = true, optional = true }
# Fetching a repo's files. Already in the tree behind `burn/network`, whose own downloader buffers
# the whole response in memory and panics on a dropped connection — neither of which suits a
# multi-gigabyte checkpoint. Same TLS backend, so this adds no second stack.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "blocking",
], optional = true }

rand = { workspace = true, default-features = false, features = [
    "std_rng",
] } # std_rng is for no_std

burn-lm-inference = { path = "../burn-lm-inference", optional = true, version = "0.0.1" }

tracing.workspace = true

[dev-dependencies]
clap = { version = "4.5.4", features = ["derive"] }

# The examples drive the real model, so they need a tokenizer feature and a backend the model can
# run on. `required-features` keeps them out of a plain `--all-targets` build instead of failing it.
[[example]]
name = "quantize"
required-features = ["llama3"]

[[example]]
name = "generate"
required-features = ["llama3", "inference-server"]

[[example]]
name = "convert"
required-features = ["llama3"]

[[example]]
name = "generate-hf"
path = "examples/generate_hf.rs"
required-features = ["hf", "inference-server"]
