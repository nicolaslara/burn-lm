[package]
name = "burn-lm-registry"
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = []
description = "Burn Large Models Engine - Registry."
documentation = "https://docs.rs/burn-lm-registry"
repository = "https://github.com/tracel-ai/burn-lm"
rust-version.workspace = true

edition.workspace = true
version.workspace = true
license.workspace = true
readme.workspace = true

[features]
# Which backend the binary picked, forwarded to the plugins so the paged decode kernel is compiled
# in for it. The backend itself is selected in `burn-lm-inference`; these only decide whether the
# kernel exists to be switched on.
metal = ["burn-lm-llama/metal"]
wgpu = ["burn-lm-llama/wgpu"]
vulkan = ["burn-lm-llama/vulkan"]
cuda = ["burn-lm-llama/cuda"]
rocm = ["burn-lm-llama/rocm"]

[dependencies]
burn-lm-inference = { path = "../burn-lm-inference", version = "0.0.1" }
burn-lm-macros = { path = "../burn-lm-macros", version = "0.0.1" }

# plugins
burn-lm-llama = { path = "../burn-lm-llama", features = [
    "inference-server",
    "llama3",
    "tiny",
], version = "0.0.1" }
burn-lm-parrot = { path = "../burn-lm-parrot", version = "0.0.1" }
